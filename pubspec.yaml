name: fintrack
description: A premium personal expense tracker built with Flutter and SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0        # local SQLite database
  path: ^1.8.3            # building the database file path
  provider: ^6.1.1         # state management
  fl_chart: ^0.66.0        # pie / bar charts on the Reports screen
  intl: ^0.19.0             # date formatting
  image_picker: ^1.0.7       # attach receipt photos
  flutter_local_notifications: ^17.0.0  # budget alerts
  google_fonts: ^6.1.0        # Fraunces + Inter, matches the Figma design

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/icons/